body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:#1a3a5c;

<body>
  <div class="box">
    <h1>🖥️ O endereço dos Chamados T.I. mudou</h1>

  <script>
    // replace() e não href: evita que o endereço antigo fique no histórico e

    location.replace('./' + location.search + location.hash);
